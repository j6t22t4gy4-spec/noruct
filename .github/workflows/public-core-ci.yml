name: public-core-ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  provider-free-core:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out exact public revision
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - name: Set up Python 3.11
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.11"
      - name: Install public Core runtime dependency
        run: >-
          python -m pip install --disable-pip-version-check --only-binary=:all:
          --require-hashes -r dev/requirements-employee-runtime-py311.lock
      - name: Compile public Core
        run: PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=src python -m compileall -q src
      - name: Verify component budgets
        run: python dev/verify_component_budgets.py --project-root .
      - name: Run public Core implementation shards
        run: PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=src python dev/run_public_core_tests.py
      - name: Verify hosted service is absent
        run: python dev/verify_public_monorepo.py --project-root . --json
